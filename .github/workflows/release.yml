name: Release

# Julkaisu syntyy automaattisesti, kun main-haaraan tulee manifest.jsoniin
# versio, jota ei ole vielä julkaistu. Voi ajaa myös käsin (Run workflow).
on:
  push:
    branches: [main]
    paths:
      - custom_components/telia_prepaid/manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Versio manifestista
        id: version
        run: |
          VERSION=$(jq -r .version custom_components/telia_prepaid/manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Versio v$VERSION on jo julkaistu."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Julkaisutiedote CHANGELOGista
        if: steps.version.outputs.exists == 'false'
        run: |
          awk -v v="## ${{ steps.version.outputs.version }}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Versio ${{ steps.version.outputs.version }}" > notes.md
      - name: Kokoa konsolitesti ja zip
        if: steps.version.outputs.exists == 'false'
        run: |
          python3 tools/build_console.py
          cd custom_components/telia_prepaid && zip -r ../../telia_prepaid.zip . -x '__pycache__/*'
      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.exists == 'false'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.version.outputs.version }}
          body_path: notes.md
          files: |
            telia_prepaid.zip
            dist/telia_prepaid_test.py
